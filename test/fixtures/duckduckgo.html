<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>DuckDuckGo fixture</title></head>
<body>
  <div id="links" class="results">
    <div class="result results_links web-result">
      <h2><a class="result__a" href="//duckduckgo.com/l/?uddg=https%3A%2F%2Fexample.com%2Fwrapped%3Fa%3D1&rut=abc">Wrapped result</a></h2>
      <a class="result__snippet" href="#">Snippet for the wrapped result.</a>
    </div>
    <div class="result results_links web-result">
      <h2><a class="result__a" href="https://example.net/direct">Direct result</a></h2>
      <div class="result__snippet">A snippet rendered in a div.</div>
    </div>
    <div class="result results_links web-result">
      <h2><a class="result__a" href="https://example.org/no-snippet">No snippet here</a></h2>
    </div>
  </div>
  <div class="result sidebar-decoy">
    <a class="result__a" href="https://ads.example/decoy">Decoy outside the results list</a>
  </div>
</body>
</html>
